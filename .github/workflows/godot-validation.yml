name: Godot foundation validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import Godot project
        run: godot --headless --editor --import --quit
      - name: Test craft document and attachment links
        run: |
          godot --headless --script res://tests/craft_document_smoke.gd | tee /tmp/craft-smoke.log
          grep -q 'CRAFT_DOCUMENT_SMOKE_PASS' /tmp/craft-smoke.log
          godot --headless --script res://tests/attachment_smoke.gd | tee /tmp/attachment-smoke.log
          grep -q 'ATTACHMENT_SMOKE_PASS' /tmp/attachment-smoke.log
          godot --headless --script res://tests/parts_catalog_smoke.gd | tee /tmp/parts-smoke.log
          grep -q 'PARTS_CATALOG_SMOKE_PASS' /tmp/parts-smoke.log
          godot --headless --script res://tests/launch_view_smoke.gd | tee /tmp/launch-view-smoke.log
          grep -q 'LAUNCH_VIEW_SMOKE_PASS' /tmp/launch-view-smoke.log
          godot --headless --script res://tests/flight_physics_smoke.gd | tee /tmp/flight-physics-smoke.log
          grep -q 'FLIGHT_PHYSICS_SMOKE_PASS' /tmp/flight-physics-smoke.log
          timeout 120s godot --headless --script res://tests/builder_flow_smoke.gd | tee /tmp/builder-flow-smoke.log
          grep -q 'BUILDER_FLOW_SMOKE_PASS' /tmp/builder-flow-smoke.log
