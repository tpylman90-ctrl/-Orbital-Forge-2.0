name: Blender test asset export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-assets.yml'
  pull_request:
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-assets.yml'

permissions:
  contents: read

jobs:
  export-glb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Install NumPy for Blender glTF exporter
        run: |
          sudo apt-get install -y python3-numpy
          blender --background --factory-startup --python-expr 'import numpy; print("Blender NumPy:", numpy.__version__)'

      - name: Generate four GLB test assets
        run: |
          blender --background --factory-startup --python tools/blender/generate_parts.py -- --out-dir build/blender
          blender --background --factory-startup --python tools/blender/generate_launch_bay.py -- --out-dir build/blender

      - name: Verify expected exports
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/blender")
          expected = {"command_pod", "fuel_tank", "rocket_engine", "station_ring"}
          manifest = json.loads((root / "manifest.json").read_text())
          assert {p["name"] for p in manifest["parts"]} == expected
          for name in expected:
              blob = (root / (name + ".glb")).read_bytes()
              assert blob[:4] == b"glTF" and len(blob) > 200, name
              print(name, len(blob), "bytes OK")
          launch = root / "launch_bay.glb"
          launch_manifest = json.loads((root / "launch_bay_manifest.json").read_text())
          assert launch.read_bytes()[:4] == b"glTF" and launch.stat().st_size > 20000
          assert launch_manifest["objects"] > 400
          print("launch_bay", launch.stat().st_size, "bytes;", launch_manifest["objects"], "objects OK")
          PY

      - name: Upload Godot-ready GLB models
        uses: actions/upload-artifact@v4
        with:
          name: orbital-forge-blender-test-assets
          path: build/blender/
          if-no-files-found: error
          retention-days: 30
