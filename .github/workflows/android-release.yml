name: Signed Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - '.github/workflows/android-release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android signing secret names
        shell: bash
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing repository secret $var. See docs/ANDROID_SIGNING.md"
              exit 1
            fi
          done
          mkdir -p build
          chmod 700 build
      - name: Recover release keystore (private)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > build/release.jks
          keytool -list -keystore build/release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
      - name: Configure Godot Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          echo "HOME=$HOME"
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          find /root/.local/share/godot/export_templates /github/home/.local/share/godot/export_templates -maxdepth 2 -name android_debug.apk -print 2>/dev/null || true
          TEMPLATES=$(find /root /opt /github/home -name android_debug.apk -path '*/4.3.stable/*' -print -quit 2>/dev/null || true)
          if [ -z "$TEMPLATES" ]; then
            echo "::error::Godot 4.3 Android export templates not found"
            exit 1
          fi
          TEMPLATE_DIR=$(dirname "$TEMPLATES")
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp "$TEMPLATE_DIR"/android_debug.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp "$TEMPLATE_DIR"/android_release.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          if [ ! -d "$SDK" ]; then
            SDK=$(dirname "$(dirname "$(find /opt /usr/local -name adb -type f -print -quit 2>/dev/null)")")
          fi
          JDK="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          if [ ! -d "$JDK" ]; then
            JDK=$(dirname "$(dirname "$(readlink -f "$(command -v keytool)")")")
          fi
          echo "SDK=$SDK JDK=$JDK"
          ls -al "$SDK/build-tools" || true
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || true
            sdkmanager --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "::warning::sdkmanager unavailable"
          fi
          test -f "$SDK/platform-tools/adb"
          test -x "$JDK/bin/keytool"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            "$JDK/bin/keytool" -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --import --quit
          godot --headless --script res://tests/craft_document_smoke.gd | tee build/craft-smoke.log
          grep -q CRAFT_DOCUMENT_SMOKE_PASS build/craft-smoke.log
          godot --headless --script res://tests/attachment_smoke.gd | tee build/attachment-smoke.log
          grep -q ATTACHMENT_SMOKE_PASS build/attachment-smoke.log
      - name: Export Android preview for external signing
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --export-debug 'Android' build/orbital-forge-2-unsigned.apk
          test -s build/orbital-forge-2-unsigned.apk
          zip -d build/orbital-forge-2-unsigned.apk "META-INF/*" >/dev/null 2>&1 || true
      - name: Align, sign, and verify preview APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          BUILD_TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -f -p 4 build/orbital-forge-2-unsigned.apk build/aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks build/release.jks --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out build/orbital-forge-2-signed-preview.apk build/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/orbital-forge-2-signed-preview.apk
          test -s build/orbital-forge-2-signed-preview.apk
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f build/release.jks
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: orbital-forge-2-signed-preview-apk
          path: build/orbital-forge-2-signed-preview.apk
          if-no-files-found: error
          retention-days: 30
